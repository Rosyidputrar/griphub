# Builds the GitHub ("full") APKs on every push to main and publishes them as a release.
#
# Hardening (audit stage 2): every action is pinned to a commit SHA (tag in comment),
# releases refuse to publish from any branch but main (workflow_dispatch included),
# and the signing key is decoded only after all dependency installs, right before the build. The app's updater
# (lib/agent/updater.dart) reads the latest release of RELEASES_REPO and installs the APK for the phone's ABI.
#
# This repository is private, and phones check for updates without signing in: a private repository's releases
# answer them 404, which the app took as "up to date". So releases go to a public repository that holds only the
# APKs (RELEASES_REPO below), with a fine-grained token that can write to that repository alone:
#   RELEASES_TOKEN     fine-grained token, repository access: RELEASES_REPO only, Contents: read and write
# RELEASES_REPO needs at least one commit (a README is enough): release tags are made on its default branch.
#
# Versions never collide: the patch number and the build number both grow with the run number, and runs are
# serialized. The base comes from pubspec.yaml (version: X.Y.Z+B), so bump X.Y there for a bigger release.
#   release = X.Y.(Z + run_number), versionCode = B + run_number
# Pull request builds use run numbers too, so release numbers can skip; they still only go up.
#
# Every APK is signed with the same release key from the repository secrets, so each update installs over the
# previous one. Without the secrets the run fails instead of publishing an APK signed with another key.
#   KEYSTORE_BASE64    base64 of the .jks file (base64 -w0 release.jks)
#   KEYSTORE_PASSWORD  store password
#   KEY_ALIAS          key alias
#   KEY_PASSWORD       key password

name: Release APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "store/**"
      - "fastlane/**"
      - "**.md"
  # Pull requests get the same build, without publishing, so a broken build shows up before merging.
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "store/**"
      - "fastlane/**"
      - "**.md"
  workflow_dispatch:

# One release at a time, in order; a newer push waits instead of cancelling a release halfway.
# A pull request only replaces its own older build.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RELEASES_REPO: seseegy/griphub-releases

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Refuse releases off main
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases publish only from main (this run is on $GITHUB_REF). Run workflow_dispatch from main, or open a pull request to main."
          exit 1

      - name: Release token
        if: github.event_name != 'pull_request'
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          # Fail before the long build, not after it.
          if [ -z "$RELEASES_TOKEN" ]; then echo "::error::Repository secret RELEASES_TOKEN is missing (see the top of this file)"; exit 1; fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Version
        id: version
        run: |
          base=$(sed -n 's/^version: *//p' pubspec.yaml)
          name=${base%%+*}
          build=${base#*+}
          [ "$build" = "$base" ] && build=0
          IFS=. read -r major minor patch <<< "$name"
          version="$major.$minor.$((patch + GITHUB_RUN_NUMBER))"
          code=$((build + GITHUB_RUN_NUMBER))
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Releasing $version ($code)"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agent/package-lock.json

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Native runtime
        run: |
          pip install lief
          python tool/bundle_runtime.py

      - name: Agent host
        working-directory: agent
        run: |
          npm ci
          node build.mjs

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Pull requests from forks get no secrets; their build falls back to the debug key.
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets for this pull request; building with the debug key"
            exit 0
          fi
          for s in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!s}" ]; then echo "::error::Repository secret $s is missing"; exit 1; fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          # Fail early on a wrong password or alias rather than after a long build.
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build APKs
        run: |
          flutter pub get
          flutter build apk --flavor full --release --split-per-abi \
            --target-platform android-arm,android-arm64,android-x64 \
            --build-name "${{ steps.version.outputs.name }}" \
            --build-number "${{ steps.version.outputs.code }}" \
            --dart-define=UPDATE_REPO=${{ env.RELEASES_REPO }}

      - name: Collect APKs
        run: |
          mkdir -p release
          shopt -s nullglob
          for abi in arm64-v8a armeabi-v7a x86_64; do
            # app-<abi>-full-release.apk; matched loosely since the flavor's place in the name varies.
            apks=(build/app/outputs/flutter-apk/*-"$abi"-*release.apk build/app/outputs/flutter-apk/*-"$abi"-release.apk)
            if [ ${#apks[@]} -eq 0 ]; then echo "::error::No APK for $abi"; ls build/app/outputs/flutter-apk; exit 1; fi
            cp "${apks[0]}" "release/griphub-${{ steps.version.outputs.name }}-$abi.apk"
          done
          (cd release && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh release

      - name: Upload build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: griphub-pr-${{ github.event.number }}
          path: release/
          retention-days: 7

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          GH_REPO: ${{ env.RELEASES_REPO }}
          TAG: v${{ steps.version.outputs.name }}
        run: |
          # --generate-notes would read the public repository, which has none of these commits: list the
          # pushed commits' first lines instead (they become public with the release).
          jq -r '.commits[]?.message | split("\n")[0] | "- " + .' "$GITHUB_EVENT_PATH" > notes.md
          [ -s notes.md ] || echo "GripHub ${{ steps.version.outputs.name }}" > notes.md
          # A re-run of the same run number replaces the files of its own release.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --title "GripHub ${{ steps.version.outputs.name }}" \
              --notes-file notes.md \
              --latest
          fi

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/key.properties
