# Runs the unit tests on every pull request and push to main:
#   - agent/ : the Node host with node:test (cd agent && npm test), including the tests that start the real host
#              process, phone mode on stdio and server mode on a unix socket (server_agent.md)
#   - app    : flutter analyze and flutter test (goldens included)
# The APK build lives in release.yml and is not a prerequisite for these.

name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: Agent host (node:test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agent/package-lock.json

      - name: Install
        working-directory: agent
        run: npm ci

      # Some tests drive real git and rsync (the runner has both).
      - name: Test
        working-directory: agent
        run: npm test

  app:
    name: Flutter app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
